name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          # SHA-256 from the official release checksums, verified when pinned.
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current checkout
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner'
      - name: Scan all fetched history
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner'
  checks:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend checks
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv build
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm run check:distribution
      - name: Browser smoke tests (fake ComfyUI)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
          BATCHCRAFT_E2E_BUILT=1 npm run test:e2e
      - name: Artifact browser security (fake ComfyUI)
        working-directory: backend
        run: PYTHONPATH=. uv run python tests/api/check_artifact_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
